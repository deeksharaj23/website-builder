<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ───────────────────────────────────────────────────────── -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- ── Primary SEO (fallback defaults; overridden per-page by useMeta) ── -->
    <title>Website Builder - Build your unique website in seconds</title>
    <meta name="description"  content="Turn your idea into a fully designed, ready-to-launch website, instantly. Powered by AI." />
    <meta name="robots"       content="index, follow" />
    <link rel="canonical"     href="https://websitebuilder.app" />

    <!-- ── Open Graph ────────────────────────────────────────────────────── -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://websitebuilder.app" />
    <meta property="og:site_name"    content="Website Builder" />
    <meta property="og:title"        content="Website Builder - Build your unique website in seconds" />
    <meta property="og:description"  content="Turn your idea into a fully designed, ready-to-launch website, instantly. Powered by AI." />
    <meta property="og:image"        content="https://websitebuilder.app/og-image.png" />
    <meta property="og:image:alt"    content="Website Builder - AI-powered website builder" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"       content="en_US" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@websitebuilder" />
    <meta name="twitter:title"       content="Website Builder - Build your unique website in seconds" />
    <meta name="twitter:description" content="Turn your idea into a fully designed, ready-to-launch website, instantly. Powered by AI." />
    <meta name="twitter:image"       content="https://websitebuilder.app/og-image.png" />

    <!-- ── Theme / PWA ───────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#F5F5F3" />

    <!-- ── Fonts ──────────────────────────────────────────────────────────── -->
    <!-- Using a system Helvetica stack (see src/index.css). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
